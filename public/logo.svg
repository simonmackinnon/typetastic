<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#7C3AED"/>
  <!-- Keyboard body -->
  <rect x="18" y="52" width="64" height="30" rx="5" fill="#ffffff" opacity="0.95"/>
  <!-- Key rows -->
  <!-- Row 1 -->
  <rect x="22" y="56" width="8" height="7" rx="2" fill="#EC4899"/>
  <rect x="32" y="56" width="8" height="7" rx="2" fill="#F97316"/>
  <rect x="42" y="56" width="8" height="7" rx="2" fill="#FBBF24"/>
  <rect x="52" y="56" width="8" height="7" rx="2" fill="#10B981"/>
  <rect x="62" y="56" width="8" height="7" rx="2" fill="#3B82F6"/>
  <!-- Row 2 -->
  <rect x="22" y="66" width="8" height="7" rx="2" fill="#3B82F6"/>
  <rect x="32" y="66" width="8" height="7" rx="2" fill="#EC4899"/>
  <rect x="42" y="66" width="18" height="7" rx="2" fill="#7C3AED"/>
  <rect x="62" y="66" width="8" height="7" rx="2" fill="#F97316"/>
  <!-- Row 3 spacebar -->
  <rect x="30" y="76" width="40" height="5" rx="2.5" fill="#FBBF24"/>
  <!-- Rocket -->
  <ellipse cx="50" cy="26" rx="8" ry="13" fill="#ffffff" opacity="0.95"/>
  <polygon points="42,26 50,10 58,26" fill="#ffffff" opacity="0.95"/>
  <rect x="44" y="30" width="12" height="8" rx="2" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="42" cy="33" rx="3" ry="5" fill="#EC4899"/>
  <ellipse cx="58" cy="33" rx="3" ry="5" fill="#EC4899"/>
  <!-- Rocket flame -->
  <ellipse cx="50" cy="40" rx="5" ry="4" fill="#FBBF24"/>
  <ellipse cx="50" cy="42" rx="3" ry="3" fill="#F97316"/>
  <!-- Rocket window -->
  <circle cx="50" cy="24" r="3" fill="#3B82F6"/>
  <circle cx="50" cy="24" r="2" fill="#60A5FA"/>
</svg>
